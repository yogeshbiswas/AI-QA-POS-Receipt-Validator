[project]
name = "qa-receipt-validator"
version = "0.1.0"
description = "AI-assisted QA application for validating POS receipts against transaction logs and business rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
